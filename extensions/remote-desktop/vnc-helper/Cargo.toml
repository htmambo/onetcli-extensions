[package]
name = "onetcli-vnc-helper"
version = "0.1.2"
edition = "2024"
publish = false
build = "build.rs"

[workspace]

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
cmake = "0.1"
bindgen = "0.72"
